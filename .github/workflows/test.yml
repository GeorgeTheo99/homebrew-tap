name: Homebrew package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Offline release-helper tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Register this exact checkout as a disposable local tap
        run: |
          # PR checkouts are detached merge commits. Give this disposable local
          # origin a main branch so the real brew-update smoke can fetch it.
          # This does not change the reviewed commit or any remote branch.
          git switch -C main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          brew tap pi-shared-ci/test "$GITHUB_WORKSPACE"
      - name: Install package without provisioning services or models
        shell: bash
        run: |
          set -euo pipefail
          metadata=$(brew info --json=v2 pi-shared-ci/test/pi-shared)
          if jq -e '.formulae[0].versions.stable != null' <<< "$metadata" >/dev/null; then
            brew install --build-from-source pi-shared-ci/test/pi-shared
          else
            brew install --HEAD --build-from-source pi-shared-ci/test/pi-shared
          fi
      - name: Exercise installed CLI and packaging contract
        run: brew test pi-shared-ci/test/pi-shared
      - name: Smoke native direct-only setup and saved lifecycle
        run: python3 -B tests/smoke_direct.py
      - name: Smoke direct remote gateway setup and offline lifecycle
        run: python3 -B tests/smoke_existing_gateway.py
      - name: Smoke recommended service setup in disposable HOME
        env:
          HOME: ${{ runner.temp }}/pi-shared-smoke-home
        run: |
          mkdir -p "$HOME"
          pi-shared setup --mode cloud --yes
          pi-shared status
          pi-shared update --plan
          pid_for() { launchctl print "gui/$(id -u)/$1" | awk '/^[[:space:]]*pid =/ && !seen++ {print $3}'; }
          gateway_before=$(pid_for com.local.model-gateway)
          browser_before=$(pid_for com.local.mcp-browser-worker)
          [[ "$gateway_before" =~ ^[0-9]+$ && "$browser_before" =~ ^[0-9]+$ ]]
          pi-shared update --modules-only
          test "$gateway_before" = "$(pid_for com.local.model-gateway)"
          test "$browser_before" = "$(pid_for com.local.mcp-browser-worker)"
          pi-shared update
          pi-shared status
          test ! -e "$HOME/.zshrc"
          printf '%s\n' '# keep custom config' '[ -f ~/.pi/generated/pi-launchers.zsh ] && source ~/.pi/generated/pi-launchers.zsh' > "$HOME/.zshrc"
          cp "$HOME/.zshrc" "$RUNNER_TEMP/pi-original-zshrc"
          pi-shared update --modules-only
          test "$(cat "$HOME/.zshrc")" = '# keep custom config'
          backups=("$HOME"/.zshrc.bak-*)
          test "${#backups[@]}" = 1
          cmp "$RUNNER_TEMP/pi-original-zshrc" "${backups[0]}"
          pi models > "$RUNNER_TEMP/pi-models.txt"
          pi --launcher-list > "$RUNNER_TEMP/pi-launcher-list.txt"
          cmp "$RUNNER_TEMP/pi-models.txt" "$RUNNER_TEMP/pi-launcher-list.txt"
          pi list
          pi --launcher-check
          pi --launcher-refresh
          pi openai --default
          test "$(jq -r .defaultProvider "$HOME/.pi/agent/settings.json")" = openai-codex
          pi --version
          pi-upstream --version
